spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          recipes-service:
            connect-timeout: 500
            read-timeout: 500

external-service:
  recipes:
    host: http://localhost:9092

logging:
  level:
    root: DEBUG
    org.hibernate.sql: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE