databaseChangeLog:
  - changeSet:
      id: 001-1
      author: kamae
      changes:
        - createTable:
            tableName: bot_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: bot_user_role_idx
            tableName: bot_user
            columns:
              - column:
                  name: role
        - insert:
            tableName: bot_user
            columns:
              - column:
                  name: id
                  value: 3c25c7a9-2d8e-4f3b-9a12-1e5b8f7a3c2d
              - column:
                  name: username
                  value: kamaev_aa
              - column:
                  name: role
                  value: ROLE_ADMIN