databaseChangeLog:
  - changeSet:
      id: 002-1-create-table-message-history
      author: kamae
      changes:
        - createTable:
            tableName: message_history
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false