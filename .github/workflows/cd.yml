name: CD Pipeline

# Триггер: только ручной запуск с параметрами
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для деплоя (формат: ветка-номерСборки, например: main-123)'
        required: true
        type: string
        default: 'master-123'
        # Это значение должно соответствовать тегу Docker образа
        # Пример: ghcr.io/username/recipes-bot:main-123
      environment:
        description: 'Окружение для деплоя'
        required: true
        type: choice  # Выпадающий список в UI
        options:
          - staging  # Тестовое окружение
          - production  # Продакшен окружение
        default: 'staging'

jobs:
  deploy:
    runs-on: ubuntu-latest  # Используем runner на GitHub

    steps:
      # Шаг 1: Настройка SSH для подключения к целевому серверу
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Шаг 2: Создание .env файла с секретами для приложения
      - name: Create environment file
        run: |
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          ENVIRONMENT=${{ github.event.inputs.environment }}
          VERSION=${{ github.event.inputs.version }}
          EOF
        # Этот файл будет использован для передачи переменных в Docker контейнер
        # Секреты подставляются на этапе выполнения workflow

      # Шаг 3: Деплой на удаленный сервер через SSH
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0  # Экшен для выполнения команд по SSH
        with:
          host: ${{ secrets.SSH_HOST }}  # IP или домен сервера
          username: ${{ secrets.SSH_USERNAME }}  # Пользователь SSH
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Приватный ключ
          script: |  # Многострочный скрипт для выполнения на сервере
            echo "${{ secrets.GH_TOKEN }}" | docker login ${{ vars.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker stop recipes-bot || true
            docker rm recipes-bot || true
            mkdir -p /opt/recipes-bot/config
            
            cat > /opt/recipes-bot/config/.env << 'EOF'
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            ENVIRONMENT=${{ github.event.inputs.environment }}
            VERSION=${{ github.event.inputs.version }}
            EOF
            
            docker run -d \
              --name recipes-bot \
              --restart unless-stopped \
              --env-file /opt/recipes-bot/config/.env \
              -v /opt/recipes-bot/logs:/app/logs \
              ${{ vars.DOCKER_REGISTRY }}/${{ vars.REGISTRY_OWNER }}/recipes-bot:${{ github.event.inputs.version }}
            
            docker image prune -f

      # Шаг 4: Проверка успешности деплоя
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sleep 30
            
            echo "=== Docker Container Status ==="
            docker ps --filter "name=recipes-bot" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "=== Recent Logs ==="
            docker logs recipes-bot --tail 20
            
            echo "=== Container Health ==="
            docker inspect recipes-bot --format='{{.State.Health.Status}}' 2>/dev/null || echo "No healthcheck configured"
            
            echo "=== Resource Usage ==="
            docker stats recipes-bot --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"