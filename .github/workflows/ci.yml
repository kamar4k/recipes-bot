name: CI Pipeline

# Триггеры запуска workflow:
# 1. Вручную через UI GitHub с параметром branch
# 2. Автоматически при push в main или develop ветки
on:
  workflow_dispatch:  # Ручной запуск из интерфейса GitHub Actions
    inputs:
      branch:
        description: 'Ветка для сборки'
        required: true
        default: 'main'
        type: string
  push:  # Автоматический запуск при push
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest  # Запуск на свежем Ubuntu контейнере

    # Права доступа, необходимые для публикации в GitHub Packages
    permissions:
      contents: read  # Чтение репозитория
      packages: write  # Запись в GitHub Container Registry

    steps:
      # Шаг 1: Получение кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4  # Стандартный экшен для клонирования репозитория
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}  # Берем ветку из параметра или из триггера push
          # Если workflow запущен вручную - берем branch из inputs
          # Если автоматически - берем текущую ветку (github.ref)

      # Шаг 2: Установка JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4  # Экшен для установки Java
        with:
          java-version: '21'  # Конкретная версия Java
          distribution: 'temurin'  # Дистрибутив Java (Eclipse Temurin - популярный выбор)
          # Temurin рекомендуется из-за лицензионной чистоты и стабильности

      # ИСПРАВЛЕНИЕ: Установка прав на выполнение для gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Шаг 3: Настройка Gradle (кеширование, безопасность)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3  # Официальный экшен от Gradle
        # Автоматически настраивает кеширование зависимостей для ускорения последующих сборок
        # Проверяет подпись Gradle Wrapper на безопасность

      # Шаг 4: Сборка проекта
      - name: Build with Gradle
        run: ./gradlew build  # Запуск стандартной задачи сборки Gradle
        # Эта команда:
        # 1. Компилирует Kotlin код
        # 2. Скачивает зависимости из репозиториев
        # 3. Проверяет код на соответствие стандартам

      # Шаг 5: Запуск тестов
      - name: Run tests
        run: ./gradlew test  # Запуск unit и integration тестов
        # Результаты тестов можно посмотреть в UI GitHub Actions
        # При падении тестов workflow завершится с ошибкой

      # Шаг 6: Создание "жирного" JAR-файла
      - name: Build shadow JAR
        run: ./gradlew shadowJar  # Создание JAR со всеми зависимостями внутри
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}  # Передаем номер сборки в Gradle
          # Это значение будет использовано в версии артефакта
          # Формат версии: 1.0.0-123 (где 123 - номер сборки)

      # Шаг 7: Сохранение JAR-файла как артефакт сборки
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recipes-bot-jar  # Имя артефакта для скачивания из UI
          path: build/libs/*.jar  # Путь к сгенерированным JAR-файлам
          retention-days: 30  # Автоматическое удаление через 30 дней (экономия места)
        # Артефакт можно скачать после завершения workflow из интерфейса GitHub

      # Шаг 5: Авторизация в GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}  # Обычно ghcr.io
          username: ${{ github.actor }}  # Имя пользователя, запустившего workflow
          password: ${{ secrets.GITHUB_TOKEN }}  # Автоматически созданный токен
          # GITHUB_TOKEN имеет ограниченные права только для текущего репозитория

      # Шаг 6: Сборка и публикация Docker образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Контекст сборки - текущая директория
          push: true  # Публиковать образ в registry
          tags: |  # Теги для образа
            ${{ vars.DOCKER_REGISTRY }}/${{ vars.REGISTRY_OWNER }}/recipes-bot:${{ github.ref_name }}-${{ github.run_number }}
            # Тег с версией: ghcr.io/username/recipes-bot:main-123
            ${{ vars.DOCKER_REGISTRY }}/${{ vars.REGISTRY_OWNER }}/recipes-bot:latest
            # Тег latest для последней успешной сборки
          labels: |  # Метаданные образа
            version=${{ github.ref_name }}-${{ github.run_number }}  # Версия сборки
            build-date=${{ github.run_id }}  # Идентификатор запуска для трассировки
          # Образ будет доступен в GitHub Packages репозитория

      # Шаг 7: Создание Release в GitHub с прикрепленным JAR
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.ref_name }}-${{ github.run_number }}  # Тег для Git
          name: Release v${{ github.ref_name }}-${{ github.run_number }}  # Название релиза
          files: |  # Файлы для прикрепления к релизу
            build/libs/*.jar  # Наш собранный JAR
          generate_release_notes: true  # Автоматически генерировать описание из коммитов
          draft: false  # Публиковать сразу (true для предварительного просмотра)
          prerelease: false  # Это не prerelease версия
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Токен для создания релиза
        # Release создается в разделе Releases репозитория
        # Тег создается автоматически в Git